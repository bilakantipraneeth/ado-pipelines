# templates/export-job.yml
# This template defines the reusable job for exporting and verifying retail data.
# It is called by each stage (Dev, Prod) and uses the variables loaded by that stage.

jobs:
  - job: ExportAndVerify
    displayName: "Export and Verify Data"
    steps:
      - task: DownloadSecureFile@1
        name: gcpKey
        displayName: "1. Download GCP Service Account Key"
        inputs:
          secureFile: $(gcpServiceAccountKeyFile)

      - task: Bash@3
        displayName: "2. Install Google Cloud SDK and jq"
        inputs:
          filePath: 'scripts/install_deps.sh'

      - task: Bash@3
        displayName: "3. Authenticate and Get Access Token"
        inputs:
          filePath: 'scripts/gcp_auth.sh'
        env:
          GCP_KEY_FILE_PATH: $(gcpKey.secureFilePath)
          GCP_PROJECT_ID: $(gcpProjectId)

      - task: Bash@3
        displayName: "4. Export Products"
        inputs:
          filePath: 'scripts/export_products.sh'
        env:
          GCP_ACCESS_TOKEN: $(GcpAccessToken)
          BQ_DATASET: $(bqDataset)
          PRODUCT_TABLE_ID_PREFIX: $(productTableIdPrefix)
          GCP_PROJECT_ID: $(gcpProjectId)
          PRODUCT_BRANCH_ID: $(productBranchId)

      - task: Bash@3
        displayName: "4a. Verify Product Export View and Count Records"
        inputs:
          filePath: 'scripts/verify_products.sh'
        env:
          PRODUCT_TABLE_ID_PREFIX: $(productTableIdPrefix)
          BQ_DATASET: $(bqDataset)

      - task: Bash@3
        displayName: "5. Export User Events"
        inputs:
          filePath: 'scripts/export_user_events.sh'
        env:
          GCP_ACCESS_TOKEN: $(GcpAccessToken)
          BQ_DATASET: $(bqDataset)
          USER_EVENT_TABLE_ID_PREFIX: $(userEventTableIdPrefix)
          GCP_PROJECT_ID: $(gcpProjectId)

      - task: Bash@3
        displayName: "5a. Verify User Event Export View and Count Records"
        inputs:
          filePath: 'scripts/verify_user_events.sh'
        env:
          USER_EVENT_TABLE_ID_PREFIX: $(userEventTableIdPrefix)
          BQ_DATASET: $(bqDataset)
